name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.91.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.91.1

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Rust tests
        run: cargo test --locked -p lmukit-context -p lmukit-core -p lmukit-virtual

      - name: Run Clippy
        run: cargo clippy --locked -p lmukit-context -p lmukit-core -p lmukit-virtual --all-targets --all-features -- -D warnings

      - name: Build LMU context probe
        run: cargo build --locked -p lmukit-context --bin lmukit-context-probe

      - name: Build experimental virtual-input probe
        run: cargo build --locked -p lmukit-virtual --bin lmukit-virtual-probe

      - name: Validate version tag
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".Substring(1)
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $packageVersion = ($metadata.packages | Where-Object name -eq "lmukit").version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($tagVersion -ne $packageVersion) {
            throw "Tag version $tagVersion does not match Cargo package version $packageVersion"
          }
          if ($tagVersion -ne $tauriVersion) {
            throw "Tag version $tagVersion does not match Tauri package version $tauriVersion"
          }

      - name: Validate updater signing secret
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is required to publish signed Pivot updates"
          }

      - name: Build executable and NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: pnpm tauri build --ci -- --locked

      - name: Package release
        id: package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          $archive = "Pivot-$version-windows-x86_64-portable.zip"
          $installerName = "Pivot-$version-windows-x86_64-setup.exe"
          $installerSignature = "$installerName.sig"
          $latest = "latest.json"
          Compress-Archive -Path "target/release/lmukit.exe" -DestinationPath $archive

          $installer = Get-ChildItem "target/release/bundle/nsis" -Filter "*-setup.exe" |
            Select-Object -First 1
          if (-not $installer) {
            throw "Tauri did not produce an NSIS installer"
          }
          $signaturePath = "$($installer.FullName).sig"
          if (-not (Test-Path $signaturePath)) {
            throw "Tauri did not produce a signed NSIS updater artifact"
          }
          Copy-Item $installer.FullName $installerName
          Copy-Item $signaturePath $installerSignature

          $tag = "${{ github.ref_name }}"
          $signature = (Get-Content $installerSignature -Raw).Trim()
          $downloadUrl = "https://github.com/aosasona/LMUKit/releases/download/$tag/$installerName"
          $manifest = [ordered]@{
            version = $version
            notes = "See the full Pivot $tag release notes on GitHub."
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = $downloadUrl
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path $latest -Encoding utf8

          foreach ($asset in @($archive, $installerName)) {
            $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
            "$hash  $asset" | Set-Content -Path "$asset.sha256" -Encoding ascii
          }
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "archive_checksum=$archive.sha256" >> $env:GITHUB_OUTPUT
          "installer=$installerName" >> $env:GITHUB_OUTPUT
          "installer_checksum=$installerName.sha256" >> $env:GITHUB_OUTPUT
          "installer_signature=$installerSignature" >> $env:GITHUB_OUTPUT
          "latest=$latest" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Pivot-${{ github.ref_name }}-windows-x86_64
          if-no-files-found: error
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive_checksum }}
            ${{ steps.package.outputs.installer }}
            ${{ steps.package.outputs.installer_checksum }}
            ${{ steps.package.outputs.installer_signature }}
            ${{ steps.package.outputs.latest }}

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @(
            "${{ steps.package.outputs.archive }}",
            "${{ steps.package.outputs.archive_checksum }}",
            "${{ steps.package.outputs.installer }}",
            "${{ steps.package.outputs.installer_checksum }}",
            "${{ steps.package.outputs.installer_signature }}",
            "${{ steps.package.outputs.latest }}"
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
          } else {
            gh release create $tag $assets --verify-tag --generate-notes --title "Pivot $tag"
          }
