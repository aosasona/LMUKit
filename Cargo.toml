[package]
name = "willa"
version = "0.1.0"
edition = "2024"
description = "A native profile manager for Le Mans Ultimate wheel configurations"
license = "MIT"

[dependencies]
anyhow = "1.0"
directories = "6.0"
eframe = "0.31"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.16", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.19"

[profile.release]
lto = "thin"
strip = true

